<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1120px; overflow: hidden; }
      body { padding: 26px 32px 30px; background: #f1f2f4; font-family: Thonburi, "Noto Sans Thai", Arial, sans-serif; color: #17191e; }
      header { height: 54px; display: flex; align-items: flex-start; justify-content: space-between; }
      h1 { margin: 0; font-size: 30px; }
      .accent { color: #8a6500; font-size: 18px; font-weight: 700; }
      main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      figure { margin: 0; position: relative; overflow: hidden; border: 1px solid #dadbde; border-radius: 12px; background: #fff; box-shadow: 0 8px 22px rgba(22,25,30,.10); }
      img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
      figcaption { position: absolute; right: 10px; bottom: 9px; min-width: 31px; height: 31px; padding: 0 8px; display: grid; place-items: center; border-radius: 999px; background: #ffd536; font-size: 15px; font-weight: 800; }
    </style>
  </head>
  <body>
    <header><h1>AI-Sales + NTOP · Executive Visual Story</h1><div class="accent">NT WHITE / YELLOW THEME</div></header>
    <main>
      <figure><img src="00-cover.png" alt="หน้าปก"/><figcaption>C</figcaption></figure>
      <figure><img src="01-problem.png" alt="ปัญหาปัจจุบัน"/><figcaption>1</figcaption></figure>
      <figure><img src="02-one-experience.png" alt="สองระบบหนึ่งประสบการณ์"/><figcaption>2</figcaption></figure>
      <figure><img src="03-grounded-answer.png" alt="คำตอบมีหลักฐาน"/><figcaption>3</figcaption></figure>
      <figure><img src="04-human-confirmation.png" alt="ผู้ใช้ยืนยัน"/><figcaption>4</figcaption></figure>
      <figure><img src="05-sales-benefits.png" alt="ประโยชน์ทีมขาย"/><figcaption>5</figcaption></figure>
      <figure><img src="06-executive-benefits.png" alt="ประโยชน์ผู้บริหาร"/><figcaption>6</figcaption></figure>
      <figure><img src="07-trust-control.png" alt="ความปลอดภัย"/><figcaption>7</figcaption></figure>
      <figure><img src="08-pilot.png" alt="แผนทดลอง"/><figcaption>8</figcaption></figure>
    </main>
  </body>
</html>
